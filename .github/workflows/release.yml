name: Release

# 打 tag（v26.1114.1235 这种 YY.MMDD.HHMM 版本）即自动构建并发布 Linux deb。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 已存在的版本标签（例如 v26.1114.1235）
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  prepare:
    name: 准备 Release
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.result }}
    steps:
      - name: 创建或复用 Release
        id: release
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG

            if (!/^v\d+\.\d+\.\d+$/.test(tag)) {
              throw new Error(`版本标签格式不对：${tag}（应形如 v26.1114.1235）`)
            }

            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`,
              })
            } catch (error) {
              if (error.status === 404) {
                throw new Error(`标签不存在：${tag}`)
              }
              throw error
            }

            try {
              const { data: release } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              })

              if (release.draft) {
                const { data: published } = await github.rest.repos.updateRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: release.id,
                  draft: false,
                  prerelease: false,
                })
                return published.id
              }

              return release.id
            } catch (error) {
              if (error.status !== 404) {
                throw error
              }
            }

            const { data: release } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `OneMail 往来 ${tag}`,
              body: [
                '| 平台 | 文件 |',
                '| --- | --- |',
                '| Linux x64 | `.deb` |',
                '| macOS（Apple Silicon / Intel） | `.dmg` |',
                '| Windows x64 | `.exe`（NSIS） |',
                '',
                'Linux：`sudo apt install ./OneMail*.deb`',
                '',
                '未签名说明：macOS 首次打开请右键 →「打开」；Windows 若出现 SmartScreen 提示，',
                '点「更多信息 → 仍要运行」。',
                '',
                '---',
                '本分支是 [OneMail](https://github.com/zhihui-hu/one-mail) 的非官方分支，',
                '以 AGPL-3.0-only 分发；对应源码即本仓库该 tag 的代码。',
              ].join('\n'),
              draft: false,
              prerelease: false,
              generate_release_notes: true,
            })

            return release.id

  test:
    name: 发布前测试
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.1
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 安装 Linux 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libayatana-appindicator3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: 前端依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查与单测
        run: |
          pnpm typecheck
          pnpm test

      - name: Rust 测试
        run: cargo test --manifest-path src-tauri/Cargo.toml

  build:
    name: 构建 ${{ matrix.name }}
    needs: [prepare, test]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64 deb
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb
          - name: macOS Apple Silicon dmg
            os: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
          - name: macOS Intel dmg
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
          - name: Windows x64 nsis
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.1
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: 安装 Linux 依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libayatana-appindicator3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: 前端依赖
        run: pnpm install --frozen-lockfile

      - name: 按 tag 同步版本号
        shell: bash
        run: |
          node -e "const fs=require('fs');const version=process.env.RELEASE_TAG.slice(1);for(const path of ['package.json','src-tauri/tauri.conf.json']){const json=JSON.parse(fs.readFileSync(path,'utf8'));json.version=version;fs.writeFileSync(path,JSON.stringify(json,null,2)+'\n')}"
          node -e "const pkg=require('./package.json');console.log('Building OneMail 往来 v'+pkg.version)"

      - name: 构建并上传安装包
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tagName: ${{ env.RELEASE_TAG }}
          projectPath: .
          uploadUpdaterJson: false
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      # Ubuntu 24.04+ 上 libgtk-3-0 已改名 libgtk-3-0t64，Tauri 自动探测的 Depends
      # 在这些发行版装不上；修补控制文件后覆盖上传同一个版本。
      - name: 修补 deb 依赖并覆盖上传
        if: runner.os == 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          # --target 构建时产物在 target/<triple>/release/bundle/deb/，
          # 由脚本递归查找并把最终路径写出来，调用方不要再猜目录
          DEB_PATH_OUT="$RUNNER_TEMP/deb-path.txt" node scripts/patch-deb-depends.mjs
          deb=$(cat "$RUNNER_TEMP/deb-path.txt")
          test -f "$deb"
          echo "uploading: $deb"
          gh release upload "${RELEASE_TAG}" "$deb" --clobber
